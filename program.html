<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Program • FLINS-ISKE 2026</title>
  <meta name="description" content="FLINS-ISKE 2026 conference website template." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=15" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
  /* ── Agenda preview (scoped to #agenda-preview) ── */
  #agenda-preview{font-family:'Segoe UI',system-ui,sans-serif}

  .preview-header{
    display:flex;align-items:center;gap:20px;
    padding:24px 20px;border-bottom:3px solid #EF4A2D;margin-bottom:20px;
    background:linear-gradient(rgba(255,255,255,0.72),rgba(255,255,255,0.72)),
               url('assets/img/sydney.png') center/cover no-repeat;
    border-radius:8px;
  }
  .preview-header__logo{height:64px;width:auto;flex-shrink:0}
  .preview-header__conf{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#EF4A2D;margin-bottom:3px}
  .preview-header__title{font-size:17px;font-weight:800;color:#1a1a1a;line-height:1.25;margin-bottom:3px}
  .preview-header__sub{font-size:12px;color:#666;font-style:italic;margin-bottom:4px}
  .preview-header__date{font-size:12px;font-weight:700;color:#c03820}

  #agenda-preview h1{display:none}
  #agenda-preview blockquote{display:none}
  #agenda-preview hr{border:none;border-top:2px solid #fdf0ed;margin:20px 0}
  #agenda-preview h2{
    font-size:16px;font-weight:800;color:#fff;background:#EF4A2D;
    padding:6px 12px;border-radius:5px;margin:22px 0 14px;
  }
  #agenda-preview h3{
    font-size:15px;font-weight:700;color:#c03820;
    margin:12px 0 2px;padding:5px 10px;background:#fdf0ed;
    border-left:4px solid #EF4A2D;border-radius:0 4px 4px 0;
  }
  #agenda-preview h3+em{
    font-size:14px;font-weight:700;color:#c03820;
    display:block;margin-bottom:6px;padding:3px 10px 3px 12px;
    background:#fae8e4;border-radius:0 4px 4px 0;
  }
  #agenda-preview p{font-size:15px;line-height:1.5;color:#1a1a1a;margin-bottom:6px}
  .agenda-nav__note{
    font-size:11px;font-style:italic;color:#999;
    margin:0 0 16px;line-height:1.4;
  }
  #agenda-preview strong{color:#c03820}
  #agenda-preview em{color:#666}

  #agenda-preview table{
    width:100%;border-collapse:collapse;font-size:15px;
    margin-bottom:12px;border-radius:6px;overflow:hidden;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  #agenda-preview thead tr{background:#f4f4f4;color:#1a1a1a}
  #agenda-preview thead th{
    padding:6px 9px;font-weight:700;text-align:left;
    font-size:14px;border-bottom:2px solid #ddd;border-top:none;
  }
  #agenda-preview tbody tr{border-bottom:1px solid #f0e0dc}
  #agenda-preview tbody tr:last-child{border-bottom:none}
  #agenda-preview tbody tr:nth-child(even){background:#fae8e4}
  #agenda-preview tbody td{padding:5px 9px;vertical-align:top;color:#1a1a1a;line-height:1.4}
  #agenda-preview .cell-time{white-space:nowrap}
  #agenda-preview .cell-loc{white-space:nowrap}

  /* section nav */
  .agenda-nav{
    display:flex;flex-direction:column;gap:6px;
    padding:10px 16px 12px;margin:0 -24px 16px;
    border-bottom:2px solid #fdf0ed;
    background:#fff;
    position:sticky;top:56px;z-index:9;
    box-shadow:0 4px 10px rgba(0,0,0,.06);
  }
  .agenda-nav-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .agenda-nav-label{
    font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.07em;color:#666;white-space:nowrap;min-width:72px;
  }
  .agenda-nav a{
    display:inline-block;padding:4px 11px;border-radius:20px;
    background:#fdf0ed;color:#c03820;
    font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .agenda-nav a:hover{background:#EF4A2D;color:#fff}

  /* title search */
  .agenda-search{
    margin:0 -24px 14px;padding:10px 24px 12px;
    background:#fff;position:sticky;z-index:8;
    border-bottom:2px solid #fdf0ed;
    box-shadow:0 4px 10px rgba(0,0,0,.06);
  }
  .agenda-search__box{
    display:flex;align-items:center;gap:8px;
    border:1.5px solid #e5cfc9;border-radius:8px;
    padding:8px 12px;background:#fff;
    transition:border-color .15s,box-shadow .15s;
  }
  .agenda-search__box:focus-within{border-color:#EF4A2D;box-shadow:0 0 0 3px rgba(239,74,45,.12)}
  .agenda-search__icon{color:#c03820;flex-shrink:0}
  .agenda-search__box input{
    flex:1;border:none;outline:none;font-size:14px;
    font-family:inherit;color:#1a1a1a;background:transparent;
  }
  .agenda-search__box input::placeholder{color:#999}
  .agenda-search__clear{
    border:none;background:#fdf0ed;color:#c03820;
    width:20px;height:20px;border-radius:50%;font-size:14px;line-height:1;
    cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }
  .agenda-search__clear:hover{background:#EF4A2D;color:#fff}
  .agenda-search__count{font-size:12px;color:#888;margin-top:6px;padding-left:2px}
  mark.search-hit{background:#ffe27a;color:#1a1a1a;padding:0 1px;border-radius:2px}

  /* scrollable table wrapper injected by JS */
  .agenda-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px}
  .agenda-table-scroll table{margin-bottom:0}

  @media (max-width:700px){
    /* Header */
    .preview-header{
      flex-direction:column;align-items:flex-start;
      gap:10px;padding:14px 12px;margin-bottom:12px;
    }
    .preview-header__logo{height:36px}
    .preview-header__conf{font-size:8px}
    .preview-header__title{font-size:14px}
    .preview-header__sub,.preview-header__date{font-size:11px}

    /* Nav */
    .agenda-nav{padding:8px 12px 10px;margin:0 -12px 12px;gap:5px;top:56px}
    .agenda-nav-row{flex-wrap:wrap}
    .agenda-nav-label{font-size:9px;min-width:56px;width:100%}
    .agenda-nav a{padding:6px 12px;font-size:12px}

    /* Search */
    .agenda-search{margin:0 -12px 12px;padding:8px 12px 10px}
    .agenda-search__box{padding:7px 10px}
    .agenda-search__box input{font-size:13px}

    /* Headings */
    #agenda-preview h2{font-size:14px;padding:7px 10px;margin:16px 0 10px}
    #agenda-preview h3{font-size:13px;padding:5px 8px}
    #agenda-preview h3+em{font-size:12px;padding:3px 8px 3px 10px}
    #agenda-preview p{font-size:13px}

    /* Tables: shrink text and let wrapper scroll horizontally */
    .agenda-table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    #agenda-preview table{font-size:12px;min-width:480px}
    #agenda-preview thead th{font-size:11px;padding:5px 7px;white-space:nowrap}
    #agenda-preview tbody td{font-size:12px;padding:4px 7px;line-height:1.35}
    #agenda-preview .cell-time{white-space:nowrap}
    #agenda-preview .cell-loc{white-space:nowrap}
  }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="banner banner-top" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" data-include="partials/sidebar.html"></aside>

    <div class="content-area">
      <header class="topbar">
        <button class="hamburger-mobile" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false" title="Open menu">
          
<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
  <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>

        </button>
        <div class="topbar__title">Conference Program</div>
      </header>

      <main id="main" class="content">
        <div id="agenda-preview"><p style="color:#888;font-size:13px">Loading program…</p></div>

      </main>
<div data-include="partials/footer.html"></div>

    </div>
  </div>

  <div class="overlay" data-overlay hidden></div>
  <script src="assets/js/include-partials.js"></script>
  <script>
  (function(){
    const preview = document.getElementById('agenda-preview');
    const LOGO = 'assets/img/logo.svg';

    marked.setOptions({ gfm: true, breaks: false });

    function buildHeader() {
      return `<div class="preview-header">
        <img class="preview-header__logo" src="${LOGO}" alt="FLINS-ISKE logo"/>
        <div>
          <div class="preview-header__conf">FLINS-ISKE 2026</div>
          <div class="preview-header__title">The 17th FLINS Conference &amp; the 21st ISKE Conference</div>
          <div class="preview-header__sub">Machine Learning and Knowledge Engineering for Decision Making</div>
          <div class="preview-header__date">July 15–19, 2026 &nbsp;·&nbsp; UTS Building 8 (CB08), Sydney, Australia</div>
        </div>
      </div>`;
    }

    function annotateTableColumns(container) {
      container.querySelectorAll('table').forEach(table => {
        const headers = [...table.querySelectorAll('thead th')]
          .map(th => th.textContent.trim().toLowerCase());
        const timeIdx    = headers.findIndex(h => h === 'time');
        const locIdx     = headers.findIndex(h => ['room','note','venue','location'].includes(h));
        const slotIdx    = headers.findIndex(h => h === 'slot');
        const noIdx      = headers.findIndex(h => ['no.','no'].includes(h));
        const paperIdIdx = headers.findIndex(h => h === 'paper id');
        const authorIdx  = headers.findIndex(h => ['authors','author'].includes(h));

        const ths = [...table.querySelectorAll('thead th')];
        const setW = (i, w) => { if (i >= 0 && ths[i]) ths[i].style.width = w; };
        setW(locIdx,     '28%');
        setW(authorIdx,  '28%');
        setW(slotIdx,    '4%');
        setW(noIdx,      '4%');
        setW(timeIdx,    locIdx >= 0 && slotIdx < 0 && noIdx < 0 ? '15%' : '13%');
        setW(paperIdIdx, '8%');
        if (paperIdIdx >= 0 && ths[paperIdIdx]) ths[paperIdIdx].style.whiteSpace = 'nowrap';
        if (slotIdx    >= 0 && ths[slotIdx])    ths[slotIdx].style.whiteSpace    = 'nowrap';

        const headerTexts = ths.map(th => th.textContent.trim());
        table.querySelectorAll('tbody tr').forEach(row => {
          const cells = [...row.querySelectorAll('td')];
          cells.forEach((td, i) => { if (headerTexts[i]) td.dataset.label = headerTexts[i]; });
          if (timeIdx >= 0 && cells[timeIdx]) cells[timeIdx].classList.add('cell-time');
          if (locIdx  >= 0 && cells[locIdx])  cells[locIdx].classList.add('cell-loc');
        });
      });
    }

    function markTitleColumns(container) {
      container.querySelectorAll('table').forEach(table => {
        const headers = [...table.querySelectorAll('thead th')]
          .map(th => th.textContent.trim().toLowerCase());
        table.dataset.titleIdx = headers.indexOf('title');
      });
    }

    function wrapTables(container) {
      container.querySelectorAll('table').forEach(table => {
        const wrapper = document.createElement('div');
        wrapper.className = 'agenda-table-scroll';
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });
    }

    function buildNav(container) {
      const nav = document.createElement('nav');
      nav.className = 'agenda-nav';

      const mkRow = label => {
        const row = document.createElement('div');
        row.className = 'agenda-nav-row';
        const lbl = document.createElement('span');
        lbl.className = 'agenda-nav-label';
        lbl.textContent = label;
        row.appendChild(lbl);
        return row;
      };

      const rowPre      = mkRow('Pre-Conference');
      const rowMain     = mkRow('Main Conference');
      const rowDetails  = mkRow('Sessions');
      const sessionLinks = [], posterLinks = [];

      container.querySelectorAll('h2').forEach((h2, i) => {
        h2.id = 'sec-' + i;
        const text = h2.textContent;
        const a = document.createElement('a');
        a.href = '#sec-' + i;
        a.onclick = e => { e.preventDefault(); h2.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

        if (text.includes('UTS')) {
          a.textContent = text.split(' | ')[0].trim();
          (text.startsWith('Day') ? rowMain : rowPre).appendChild(a);
        } else if (/Poster Session (\d+)/i.test(text)) {
          const n = parseInt(text.match(/Poster Session (\d+)/i)[1]);
          const notice = h2.previousElementSibling?.classList.contains('notice-box') ? h2.previousElementSibling : null;
          if (notice) a.onclick = e => { e.preventDefault(); notice.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
          a.textContent = 'Day ' + n + ' Poster';
          posterLinks[n - 1] = a;
        } else {
          const m = text.match(/Day (\d+)/);
          const n = m ? parseInt(m[1]) : sessionLinks.length + 1;
          a.textContent = 'Day ' + n + ' Sessions';
          sessionLinks[n - 1] = a;
        }
      });

      for (let i = 0; i < Math.max(sessionLinks.length, posterLinks.length); i++) {
        if (sessionLinks[i]) rowDetails.appendChild(sessionLinks[i]);
        if (posterLinks[i]) rowDetails.appendChild(posterLinks[i]);
      }

      const noteEl = document.createElement('p');
      noteEl.className = 'agenda-nav__note';
      noteEl.textContent = '* Author names are imported from OpenReview and may differ from your camera-ready version. The final proceedings will use names from your camera-ready submission.';

      nav.appendChild(rowPre);
      nav.appendChild(rowMain);
      nav.appendChild(rowDetails);
      const header = container.querySelector('.preview-header');
      if (header) header.after(nav); else container.prepend(nav);
      nav.after(noteEl);

      // offset scrollIntoView so h2 clears both sticky topbar and sticky nav
      const topbarH = document.querySelector('.topbar')?.offsetHeight ?? 56;
      const offset = topbarH + nav.offsetHeight + 8;
      container.querySelectorAll('h2').forEach(h => h.style.scrollMarginTop = offset + 'px');
      container.querySelectorAll('.notice-box').forEach(n => n.style.scrollMarginTop = offset + 'px');
    }



    function buildSearch(container) {
      const wrap = document.createElement('div');
      wrap.className = 'agenda-search';
      wrap.innerHTML =
        '<div class="agenda-search__box">' +
          '<svg class="agenda-search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
          '<input type="search" id="agenda-title-search" placeholder="Search paper titles…" autocomplete="off" aria-label="Search paper titles"/>' +
          '<button type="button" class="agenda-search__clear" id="agenda-title-search-clear" aria-label="Clear search" hidden>&times;</button>' +
        '</div>' +
        '<div class="agenda-search__count" id="agenda-title-search-count"></div>';

      const nav = container.querySelector('.agenda-nav');
      if (nav) nav.after(wrap); else container.prepend(wrap);

      const topbarH = document.querySelector('.topbar')?.offsetHeight ?? 56;
      wrap.style.top = (topbarH + (nav ? nav.offsetHeight : 0)) + 'px';

      const input     = wrap.querySelector('#agenda-title-search');
      const clearBtn  = wrap.querySelector('#agenda-title-search-clear');
      const countEl   = wrap.querySelector('#agenda-title-search-count');

      const escapeRegExp = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

      function clearHighlights() {
        container.querySelectorAll('mark.search-hit').forEach(m => {
          const parent = m.parentNode;
          parent.replaceChild(document.createTextNode(m.textContent), m);
          parent.normalize();
        });
      }

      function highlight(cell, q) {
        const re = new RegExp('(' + escapeRegExp(q) + ')', 'ig');
        const walker = document.createTreeWalker(cell, NodeFilter.SHOW_TEXT);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        textNodes.forEach(node => {
          const text = node.textContent;
          re.lastIndex = 0;
          if (!re.test(text)) return;
          re.lastIndex = 0;
          const frag = document.createDocumentFragment();
          let lastIdx = 0, m;
          while ((m = re.exec(text))) {
            frag.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
            const mark = document.createElement('mark');
            mark.className = 'search-hit';
            mark.textContent = m[0];
            frag.appendChild(mark);
            lastIdx = m.index + m[0].length;
            if (m[0].length === 0) re.lastIndex++;
          }
          frag.appendChild(document.createTextNode(text.slice(lastIdx)));
          node.parentNode.replaceChild(frag, node);
        });
      }

      function showAll() {
        container.querySelectorAll('h2, h3, hr, .notice-box, .agenda-table-scroll').forEach(el => { el.style.display = ''; });
        container.querySelectorAll('h3 + em').forEach(el => { el.style.display = ''; });
        container.querySelectorAll('tbody tr').forEach(tr => { tr.style.display = ''; });
      }

      function runSearch(rawQuery) {
        clearHighlights();
        const q = rawQuery.trim().toLowerCase();
        clearBtn.hidden = !q;

        if (!q) {
          showAll();
          countEl.textContent = '';
          return;
        }

        // Only elements that come after the header/nav/search/note belong to the flowing content.
        const children = [...container.children].filter(el =>
          el.tagName !== 'NAV' &&
          !el.classList.contains('preview-header') &&
          !el.classList.contains('agenda-search') &&
          !el.classList.contains('agenda-nav__note')
        );

        let totalMatches = 0;
        let sectionEl = null, sectionExtras = [], sectionHasMatch = false;
        let h3El = null, h3Em = null;

        const flushSection = () => {
          if (!sectionEl) return;
          const show = sectionHasMatch;
          sectionEl.style.display = show ? '' : 'none';
          sectionExtras.forEach(el => { el.style.display = show ? '' : 'none'; });
        };

        for (const el of children) {
          const tag = el.tagName.toLowerCase();

          if (tag === 'h2') {
            flushSection();
            sectionEl = el; sectionExtras = []; sectionHasMatch = false;
            h3El = null; h3Em = null;
            continue;
          }
          if (!sectionEl) continue;

          if (tag === 'h3') {
            h3El = el; h3Em = null;
            continue;
          }
          if (tag === 'em' && h3El && !h3Em) {
            h3Em = el;
            continue;
          }
          if (tag === 'div' && el.classList.contains('agenda-table-scroll')) {
            const table = el.querySelector('table');
            const titleIdx = table ? parseInt(table.dataset.titleIdx, 10) : -1;
            let tableHasMatch = false;

            if (table && titleIdx >= 0) {
              table.querySelectorAll('tbody tr').forEach(tr => {
                const cell = tr.children[titleIdx];
                const text = cell ? cell.textContent : '';
                const match = text.toLowerCase().includes(q);
                tr.style.display = match ? '' : 'none';
                if (match) {
                  tableHasMatch = true;
                  totalMatches++;
                  highlight(cell, q);
                }
              });
            }

            el.style.display = tableHasMatch ? '' : 'none';
            if (h3El) {
              h3El.style.display = tableHasMatch ? '' : 'none';
              if (h3Em) h3Em.style.display = tableHasMatch ? '' : 'none';
              h3El = null; h3Em = null;
            }
            sectionHasMatch = sectionHasMatch || tableHasMatch;
            continue;
          }

          // hr, notice-box, and anything else follow the overall section's match state
          sectionExtras.push(el);
        }
        flushSection();

        countEl.textContent = totalMatches === 0
          ? 'No papers found.'
          : totalMatches + ' paper' + (totalMatches === 1 ? '' : 's') + ' found.';
      }

      let debounceT;
      input.addEventListener('input', () => {
        clearTimeout(debounceT);
        debounceT = setTimeout(() => runSearch(input.value), 120);
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Escape' && input.value) { input.value = ''; runSearch(''); }
      });
      clearBtn.addEventListener('click', () => { input.value = ''; runSearch(''); input.focus(); });
    }

    function addPosterNotices(container) {
      container.querySelectorAll('h2').forEach(h2 => {
        if (/Poster Session \d+/i.test(h2.textContent)) {
          const notice = document.createElement('div');
          notice.className = 'notice-box';
          notice.innerHTML =
            '<strong>Poster Session Arrangement:</strong> The poster session runs the whole day, ' +
            'specifically during the morning breaks, lunch, and afternoon breaks. ' +
            '<strong>Setup:</strong> Put your poster (<mark><strong>A0 portrait</strong></mark>) on the provided board at the venue in the morning. ' +
            '<strong>Authors:</strong> Stand by your poster during breaks so attendees can discuss your work with you. ' +
            '<strong>Teardown:</strong> Please remove your poster at the end of the day.';
          h2.before(notice);
        }
      });
    }

    fetch('assets/files/agenda.md')
      .then(r => { if (!r.ok) throw new Error(); return r.text(); })
      .then(md => {
        preview.innerHTML = buildHeader() + marked.parse(md);
        annotateTableColumns(preview);
        markTitleColumns(preview);
        addPosterNotices(preview);
        buildNav(preview);
        wrapTables(preview);
        buildSearch(preview);
      })
      .catch(() => {
        preview.innerHTML = '<p style="color:#c03820">Could not load program. Please try again later.</p>';
      });
  })();
  </script>
</body>
</html>
